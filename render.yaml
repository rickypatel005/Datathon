services:
  # PostgreSQL Database
  - type: pgo
    name: datamind-db
    plan: free # Change to a paid plan if you need more resources
    databaseName: datamind_db
    user: datamind

  # FastAPI Backend
  - type: web
    name: datamind-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: datamind-db
          property: connectionString
      - key: SECRET_KEY
        sync: false # Set this securely in the Render Dashboard
      - key: OPENAI_API_KEY
        sync: false # Set this securely in the Render Dashboard
      - key: GROQ_API_KEY
        sync: false # Set this securely in the Render Dashboard

  # React Frontend (Vite)
  - type: web
    name: datamind-frontend
    env: static
    buildCommand: "npm install --legacy-peer-deps && npm run build"
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: datamind-backend
          property: hostport
